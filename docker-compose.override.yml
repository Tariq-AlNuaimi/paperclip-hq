# Merged on top of upstream docker/docker-compose.quickstart.yml by bootstrap.sh.
# Paperclip listens on loopback only; Caddy is the single public entry (HTTPS + password gate).
services:
  paperclip:
    # Prebuilt upstream image (bootstrap.sh sets PAPERCLIP_IMAGE from PAPERCLIP_REF), not a source build.
    build: !reset null
    image: ${PAPERCLIP_IMAGE:?bootstrap.sh sets PAPERCLIP_IMAGE}
    restart: unless-stopped
    ports: !override
      - "127.0.0.1:${PAPERCLIP_PORT:-3100}:3100"
    environment:
      PAPERCLIP_DEPLOYMENT_EXPOSURE: public
      # authenticated+public refuses the embedded database, so it gets a real Postgres.
      DATABASE_URL: postgres://paperclip:${PAPERCLIP_DB_PASSWORD:?set PAPERCLIP_DB_PASSWORD}@postgres:5432/paperclip
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GH_TOKEN: ${GH_TOKEN:-}
      PAPERCLIP_TELEMETRY_DISABLED: ${PAPERCLIP_TELEMETRY_DISABLED:-1}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: mirror.gcr.io/library/postgres:17-alpine # Docker Hub mirror: no pull rate limit
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperclip
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${PAPERCLIP_DB_PASSWORD:?set PAPERCLIP_DB_PASSWORD}
    volumes:
      # Outside ./data: Paperclip chowns its whole data mount at startup, which would break Postgres.
      - ../../pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 20

  caddy:
    image: mirror.gcr.io/library/caddy:2.10-alpine
    restart: unless-stopped
    network_mode: host # reach Paperclip on 127.0.0.1:3100
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-admin}
    volumes:
      - ../../caddy/Caddyfile.rendered:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - paperclip

volumes:
  caddy-data:
  caddy-config:
